<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サイバーキルチェーン：ランサムウェア攻撃の流れ</title>
<style>
  :root {
    --bg: #f3f5f7; --panel: #ffffff; --ink: #14202b; --sub: #5a6b7a;
    --line: #cfd8e0; --trigger: #1f6f8b; --tech: #c77d0a; --exec: #b3261e;
    --safe: #2a7d4f; --active-bg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10171d; --panel: #18222b; --ink: #e8eef3; --sub: #9db0c0;
      --line: #2c3b48; --trigger: #4fb3d1; --tech: #f0a93a; --exec: #ff6b61;
      --safe: #5fcf94; --active-bg: #1d2a35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; line-height: 1.7;
  }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 20px; font-size: .95rem; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  button {
    font: inherit; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button:hover { border-color: var(--sub); }
  button:focus-visible { outline: 3px solid var(--trigger); outline-offset: 2px; }
  button.primary { background: var(--exec); border-color: var(--exec); color: #fff; }

  /* 3 phases */
  .phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-bottom: 8px; }
  .phase-tab {
    padding: 8px 12px; font-weight: 700; font-size: .9rem; color: #fff; text-align: center;
  }
  .phase-tab.p1 { background: var(--trigger); border-radius: 6px 0 0 6px; }
  .phase-tab.p2 { background: var(--tech); }
  .phase-tab.p3 { background: var(--exec); border-radius: 0 6px 6px 0; }
  .phase-tab { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); }
  .phase-tab:last-child { clip-path: none; }

  /* stage rail */
  .rail { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
  .stage {
    text-align: left; padding: 10px 8px; min-height: 92px; border-radius: 8px;
    border: 2px solid var(--line); background: var(--panel); color: var(--sub);
    display: flex; flex-direction: column; gap: 4px; transition: border-color .2s, color .2s, transform .2s;
  }
  .stage .n { font-size: .75rem; }
  .stage .t { font-weight: 700; font-size: .85rem; line-height: 1.35; color: var(--ink); }
  .stage.done { border-color: var(--sub); }
  .stage.active { background: var(--active-bg); transform: translateY(-3px); color: var(--ink); }
  .stage.c1.active, .stage.c1.done { border-color: var(--trigger); }
  .stage.c2.active, .stage.c2.done { border-color: var(--tech); }
  .stage.c3.active, .stage.c3.done { border-color: var(--exec); }
  .stage.defended { border-color: var(--safe) !important; }

  /* detail */
  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .detail h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .tag { display: inline-block; font-size: .8rem; padding: 1px 10px; border-radius: 99px; color: #fff; margin-bottom: 8px; }
  .tag.c1 { background: var(--trigger); } .tag.c2 { background: var(--tech); } .tag.c3 { background: var(--exec); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; }
  .cols h3 { margin: 0 0 6px; font-size: .95rem; }
  .cols ul { margin: 0; padding-left: 1.2em; font-size: .92rem; }
  .cols .def h3 { color: var(--safe); }
  .cols .atk h3 { color: var(--exec); }

  /* simulation */
  .sim { margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .sim h2 { margin: 0 0 8px; font-size: 1rem; }
  .net { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .node {
    width: 74px; padding: 8px 4px; text-align: center; font-size: .75rem;
    border-radius: 8px; border: 2px solid var(--line); background: var(--bg);
    transition: background .4s, border-color .4s, color .4s;
  }
  .node .ic { font-size: 1.4rem; display: block; }
  .node.hit { border-color: var(--tech); background: color-mix(in srgb, var(--tech) 22%, var(--bg)); }
  .node.enc { border-color: var(--exec); background: color-mix(in srgb, var(--exec) 28%, var(--bg)); }
  .node.enc .ic { filter: grayscale(1); }
  .node.safe { border-color: var(--safe); background: color-mix(in srgb, var(--safe) 20%, var(--bg)); }
  .log {
    margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--bg);
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; min-height: 64px; color: var(--sub);
  }
  .note { margin-top: 20px; font-size: .8rem; color: var(--sub); }

  @media (max-width: 720px) {
    .rail { grid-template-columns: repeat(2, 1fr); }
    .phases { grid-template-columns: 1fr; }
    .phase-tab, .phase-tab:last-child { clip-path: none; border-radius: 6px; margin-bottom: 4px; }
    .cols { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>サイバーキルチェーン：ランサムウェア攻撃の流れ</h1>
  <p class="lead">きっかけ → 攻撃手法 → ランサムの実行。各段階をクリックすると、攻撃側の動きと防御ポイントを確認できます。（教育・防御目的の概念図です）</p>

  <div class="controls">
    <button class="primary" id="play">▶ 攻撃の流れを再生</button>
    <button id="prev">← 前へ</button>
    <button id="next">次へ →</button>
    <button id="defend" aria-pressed="false">防御をON（ここで止める）</button>
    <button id="reset">リセット</button>
  </div>

  <div class="phases" aria-hidden="true">
    <div class="phase-tab p1">① 始まるきっかけ</div>
    <div class="phase-tab p2">② 攻撃手法</div>
    <div class="phase-tab p3">③ ランサムの実行</div>
  </div>

  <div class="rail" id="rail"></div>

  <section class="detail" id="detail" aria-live="polite"></section>

  <section class="sim">
    <h2>社内ネットワークでの被害イメージ</h2>
    <div class="net" id="net"></div>
    <div class="log" id="log">▶ を押すと、攻撃の進行が表示されます。</div>
  </section>

  <p class="note">※ 本ページはキルチェーンの考え方を学ぶための模式図で、実際の攻撃コードは含みません。</p>
</main>

<script>
const STAGES = [
  { phase: 1, name: "偵察", en: "Reconnaissance",
    desc: "標的の組織情報・メールアドレス・公開サーバーなどを調べる段階。",
    atk: ["SNSや公式サイトから社員情報を収集", "外部公開サーバーやVPN機器の探索", "漏えい済みID/パスワードの入手"],
    def: ["公開情報の棚卸し・不要な公開の停止", "VPN/公開機器の最新パッチ適用", "ID漏えい監視とパスワード変更"],
    log: "標的企業の公開情報・VPN機器を調査中…", nodes: [] },
  { phase: 1, name: "武器化", en: "Weaponization",
    desc: "不正な添付ファイルや偽サイトなど、侵入に使う道具を準備する段階。",
    atk: ["不正文書・偽ログインページの作成", "ばらまき用のメール文面を用意"],
    def: ["脅威インテリジェンスの活用", "なりすましメール対策（SPF/DKIM/DMARC）"],
    log: "（攻撃者側）侵入用の道具を準備…", nodes: [] },
  { phase: 2, name: "配送", en: "Delivery",
    desc: "メール・Web・VPN経由で、標的に攻撃を届ける段階。ここが最も多い『きっかけ』です。",
    atk: ["フィッシング／標的型メール", "改ざんサイトからの誘導", "VPN機器の脆弱性を突く不正アクセス"],
    def: ["メールフィルタ・サンドボックス", "従業員向け訓練（不審メール報告）", "機器の脆弱性管理"],
    log: "不審メールが従業員PCに到達。", nodes: [0] },
  { phase: 2, name: "悪用・感染", en: "Exploitation / Installation",
    desc: "添付ファイルを開く、認証情報を入力するなどで侵入が成立し、足がかりが作られる段階。",
    atk: ["不正マクロやスクリプトの実行", "盗んだ認証情報でのログイン", "遠隔操作ツールの設置"],
    def: ["EDRによる不審な動作の検知", "マクロ実行の制限", "多要素認証（MFA）"],
    log: "PC-1 が感染。遠隔操作の足がかりが作られた。", nodes: [0] },
  { phase: 2, name: "権限昇格・横展開", en: "C2 / Lateral Movement",
    desc: "外部と通信しつつ、管理者権限を奪い、社内の他の端末やサーバーへ広げる段階。",
    atk: ["管理者アカウントの窃取", "ファイルサーバー・ADへの侵入", "バックアップの場所を調査"],
    def: ["特権アカウントの最小化・分離", "ネットワーク分割", "不審な通信・ログインの監視"],
    log: "管理者権限を奪取。サーバー・バックアップへ拡大中…", nodes: [0,1,2,3] },
  { phase: 3, name: "データ窃取・準備", en: "Exfiltration / Pre-encryption",
    desc: "データを外部へ持ち出し（二重恐喝）、バックアップを破壊して復旧を妨害する段階。",
    atk: ["機密データの外部送信", "バックアップ・セキュリティ製品の停止"],
    def: ["大量送信の検知（DLP）", "オフライン／改変不可のバックアップ"],
    log: "データを外部へ送信、バックアップを削除。", nodes: [0,1,2,3,4] },
  { phase: 3, name: "ランサムの実行", en: "Actions on Objectives",
    desc: "一斉にファイルを暗号化し、脅迫文を表示して身代金を要求する段階。",
    atk: ["全端末・サーバーの一斉暗号化", "脅迫文の表示、金銭の要求", "『支払わなければ公開する』と脅す"],
    def: ["事前の復旧訓練と事業継続計画（BCP）", "感染端末の即時ネットワーク隔離", "警察・専門機関への相談"],
    log: "⚠ ファイルが暗号化されました。身代金を要求されています。", nodes: [0,1,2,3,4], enc: true }
];

const NODES = [
  { ic: "💻", n: "従業員PC" }, { ic: "🖥", n: "業務PC" },
  { ic: "🗄", n: "ファイルSV" }, { ic: "🔑", n: "認証SV" }, { ic: "💾", n: "バックアップ" }
];

const rail = document.getElementById("rail");
const detail = document.getElementById("detail");
const net = document.getElementById("net");
const logEl = document.getElementById("log");
const playBtn = document.getElementById("play");
const defendBtn = document.getElementById("defend");

let cur = -1, timer = null, defended = false;
const DEFENSE_STOP = 3; // 防御ONのとき、この段階で攻撃を止める

STAGES.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = `stage c${s.phase}`;
  b.innerHTML = `<span class="n">段階 ${i + 1}</span><span class="t">${s.name}</span><span class="n">${s.en}</span>`;
  b.addEventListener("click", () => { stop(); go(i); });
  rail.appendChild(b);
});
NODES.forEach(n => {
  const d = document.createElement("div");
  d.className = "node";
  d.innerHTML = `<span class="ic">${n.ic}</span>${n.n}`;
  net.appendChild(d);
});

function render() {
  [...rail.children].forEach((el, i) => {
    el.classList.toggle("active", i === cur);
    el.classList.toggle("done", i < cur);
    el.classList.toggle("defended", defended && i === DEFENSE_STOP && cur >= DEFENSE_STOP);
  });

  const nodes = [...net.children];
  nodes.forEach(n => n.className = "node");
  if (cur < 0) { detail.innerHTML = "<p>段階を選ぶか、「再生」を押してください。</p>"; logEl.textContent = "▶ を押すと、攻撃の進行が表示されます。"; return; }

  const s = STAGES[cur];
  const blocked = defended && cur >= DEFENSE_STOP;
  const upto = blocked ? STAGES[DEFENSE_STOP].nodes : s.nodes;
  upto.forEach(i => nodes[i].classList.add(s.enc && !blocked ? "enc" : "hit"));
  if (blocked) nodes.forEach((n, i) => { if (!upto.includes(i)) n.classList.add("safe"); });

  const label = ["", "① 始まるきっかけ", "② 攻撃手法", "③ ランサムの実行"][s.phase];
  detail.innerHTML = `
    <span class="tag c${s.phase}">${label}</span>
    <h2>段階 ${cur + 1}：${s.name}（${s.en}）</h2>
    <p>${s.desc}</p>
    <div class="cols">
      <div class="atk"><h3>攻撃側の動き</h3><ul>${s.atk.map(x => `<li>${x}</li>`).join("")}</ul></div>
      <div class="def"><h3>防御ポイント</h3><ul>${s.def.map(x => `<li>${x}</li>`).join("")}</ul></div>
    </div>`;

  logEl.textContent = blocked
    ? "✔ 防御が有効：EDR・隔離により、拡大前に攻撃を遮断しました。"
    : s.log;
}

function go(i) { cur = Math.max(0, Math.min(STAGES.length - 1, i)); render(); }

function stop() { clearInterval(timer); timer = null; playBtn.textContent = "▶ 攻撃の流れを再生"; }

playBtn.addEventListener("click", () => {
  if (timer) { stop(); return; }
  if (cur >= STAGES.length - 1) cur = -1;
  playBtn.textContent = "⏸ 一時停止";
  timer = setInterval(() => {
    if (cur >= STAGES.length - 1) { stop(); return; }
    go(cur + 1);
    if (defended && cur >= DEFENSE_STOP) stop();
  }, 1800);
});
document.getElementById("next").addEventListener("click", () => { stop(); go(cur + 1); });
document.getElementById("prev").addEventListener("click", () => { stop(); go(cur - 1); });
document.getElementById("reset").addEventListener("click", () => { stop(); cur = -1; render(); });
defendBtn.addEventListener("click", () => {
  defended = !defended;
  defendBtn.setAttribute("aria-pressed", defended);
  defendBtn.textContent = defended ? "防御をOFFにする" : "防御をON（ここで止める）";
  render();
});

render();
</script>
</body>
</html>
